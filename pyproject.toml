[project]
name = "weapon-detection"
version = "0.1.0"
description = "Local firearm detection and incident review academic prototype"
readme = "README.md"
authors = [
    { name = "Sultan Shah", email = "sultanshah.bscsf24@iba-suk.edu.pk" }
]
requires-python = ">=3.11,<3.12"
dependencies = [
    "numpy>=2.4.6",
    "opencv-python>=5.1.0.95",
    "pandas>=3.1.1",
    "pillow>=13.0.0",
    "plotly>=7.1.0",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.4",
    "streamlit>=1.67.0",
    "torch>=2.15.0",
    "torchvision>=0.29.2",
    "ultralytics>=8.4.216",
]

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
